<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><rect x="0" y="0" width="1200" height="560" rx="32" ry="32" fill="#F5EEFA"/><text x="56" y="74" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#1D1B20" text-anchor="start">Architecture</text><text x="56" y="104" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#49454F" text-anchor="start">Layered and async-first. Each layer talks only to the one below it.</text><rect x="56" y="140" width="800" height="84" rx="24" ry="24" fill="#6750A4"/><text x="88" y="180" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">Handlers</text><text x="88" y="206" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#EADDFF" text-anchor="start">aiogram routers &#183; FSM wizards &#183; reply / inline keyboards</text><rect x="56" y="240" width="800" height="84" rx="24" ry="24" fill="#5B4E8C"/><text x="88" y="280" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">Services</text><text x="88" y="306" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#EADDFF" text-anchor="start">async orchestration &#183; validation &#183; asyncio.to_thread</text><rect x="56" y="340" width="800" height="84" rx="24" ry="24" fill="#4F4577"/><text x="88" y="380" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">Repositories</text><text x="88" y="406" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#EADDFF" text-anchor="start">synchronous Supabase queries, one module per table</text><rect x="56" y="440" width="800" height="84" rx="24" ry="24" fill="#3F3960"/><text x="88" y="480" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">Database</text><text x="88" y="506" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#EADDFF" text-anchor="start">Supabase Postgres &#183; RLS on &#183; CHECK constraints</text><rect x="896" y="140" width="248" height="344" rx="24" ry="24" fill="#FFFFFF" stroke="#7A757F" stroke-width="1.5"/><text x="1020" y="176" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle" letter-spacing="2">CROSS-CUTTING</text><rect x="916" y="196" width="208" height="84" rx="20" ry="20" fill="#E8DEF8"/><text x="1020" y="232" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1D192B" text-anchor="middle">Filters</text><text x="1020" y="256" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D192B" text-anchor="middle">IsAdmin &#183; IsVerified</text><rect x="916" y="292" width="208" height="84" rx="20" ry="20" fill="#FFD8E4"/><text x="1020" y="328" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#31111D" text-anchor="middle">FSM storage</text><text x="1020" y="352" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#31111D" text-anchor="middle">in-memory</text><rect x="916" y="388" width="208" height="84" rx="20" ry="20" fill="#C7E7C9"/><text x="1020" y="424" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0F3D18" text-anchor="middle">Notifier</text><text x="1020" y="448" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0F3D18" text-anchor="middle">background asyncio task</text></svg>
